[package]
name = "moonshot"
version = "0.1.0"
description = "Moonshot — premium desktop chat that turns words into AI slides via Codex CLI"
authors = ["Moonshot"]
edition = "2021"

[lib]
name = "moonshot_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.dev]
incremental = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
